[package]
name = "agpeek"
version = "0.1.0"
edition = "2024"
description = "Inspect iOS App Group containers"
license = "MIT"

[dependencies]
# Clap handles subcommand routing and help text generation
clap = { version = "4.5", features = ["derive"] }
# Anyhow carries context up to the command boundary
anyhow = "1"
# Serde deserializes simctl's JSON and serializes our own --json output
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Anstream strips ANSI escapes when stdout is not a terminal; anstyle builds them
anstream = "0.6"
anstyle = "1"

[dev-dependencies]
# Assert_cmd drives the built binary in integration tests
assert_cmd = "2"
predicates = "3"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
# Panicking on container contents is the one thing this tool must never do (PRD R1)
unwrap_used = "warn"
expect_used = "warn"
